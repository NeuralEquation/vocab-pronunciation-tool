<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="MW発音確認">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.png" type="image/png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Merriam-Webster 発音確認ツール</title>
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="app">
    <header>
      <div class="topline">
        <div>
          <h1>Merriam-Webster 発音確認</h1>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><strong id="usageToday">0</strong>今日のAPI</div>
        <div class="stat"><strong id="storageSize">0KB</strong>保存容量</div>
        <div class="stat"><strong id="rangeCount">0</strong>範囲</div>
      </div>
      <div id="storageWarning"></div>
    </header>

    <nav class="tabs" aria-label="画面切り替え">
      <button class="soft" data-tab="ranges" aria-selected="true">範囲</button>
      <button class="soft" data-tab="import">登録</button>
      <button class="soft" data-tab="backup">保存</button>
      <button class="soft" data-tab="settings">設定</button>
    </nav>

    <main class="grid layout">
      <section class="panel tab-page hidden" id="page-settings">
        <h2>APIキー設定</h2>
        <label for="apiKey">Learner's Dictionary APIキー</label>
        <input id="apiKey" type="password" autocomplete="off" placeholder="Learner's用キーをスマホ本番確認時に入力">
        <label for="collegiateApiKey">Collegiate Dictionary APIキー（任意・フォールバック用）</label>
        <input id="collegiateApiKey" type="password" autocomplete="off" placeholder="Collegiate用キー。必要な場合だけ入力">
        <label for="dictionaryType">使用辞書</label>
        <select id="dictionaryType">
          <option value="learners">Learner's Dictionary（初期設定）</option>
          <option value="collegiate">Collegiate Dictionary</option>
        </select>
        <label for="definitionLimit">保存する定義数</label>
        <select id="definitionLimit">
          <option value="2">最大2個</option>
          <option value="3">最大3個</option>
        </select>
        <label class="switch"><input id="demoMode" type="checkbox"> デモモードON</label>
        <label class="switch"><input id="saveKey" type="checkbox"> このブラウザにAPIキーを保存する</label>
        <div class="actions">
          <button class="soft" id="saveApiSettings">設定を保存</button>
          <button class="danger" id="clearApiKey">APIキー削除</button>
        </div>
      </section>

      <section class="panel tab-page" id="page-ranges">
        <h2>範囲一覧</h2>
        <div class="row">
          <div>
            <label for="rangeFilter">絞り込み</label>
            <select id="rangeFilter">
              <option value="all">すべて</option>
              <option value="今日の範囲">今日の範囲</option>
              <option value="次回の範囲">次回の範囲</option>
              <option value="終了">終了</option>
              <option value="削除予定">削除予定</option>
            </select>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="openNext">次回の範囲を開く</button>
        </div>
        <div id="rangeList" style="margin-top:12px"></div>
      </section>

      <section class="panel tab-page hidden" id="page-import">
        <h2>範囲登録</h2>
        <div class="row">
          <div>
            <label for="rangeName">範囲名</label>
            <input id="rangeName" placeholder="Section 59-60">
          </div>
          <div>
            <label for="testDate">テスト日</label>
            <input id="testDate" type="date">
          </div>
          <div>
            <label for="weekday">曜日</label>
            <select id="weekday">
              <option value="">自動</option>
              <option>月</option><option>火</option><option>水</option><option>木</option><option>金</option><option>土</option><option>日</option>
            </select>
          </div>
          <div>
            <label for="pages">ページ範囲</label>
            <input id="pages" placeholder="312-320">
          </div>
          <div>
            <label for="deleteAt">削除予定日時</label>
            <input id="deleteAt" type="datetime-local">
          </div>
          <div class="wide">
            <label for="wordInput">単語リスト</label>
            <div class="meta input-help">1行に「英単語[TAB]日本語訳」。複数の訳は「／」で区切れます。英単語だけの登録も可能です。</div>
            <textarea id="wordInput" placeholder="previous&#9;以前の／前の
previously&#9;以前に／前もって
record&#9;記録／記録する"></textarea>
          </div>
        </div>
        <div class="actions">
          <button class="primary" id="importRange">範囲を登録</button>
          <button class="soft" id="clearImport">入力クリア</button>
        </div>
      </section>

      <section class="panel tab-page hidden" id="page-backup">
        <h2>バックアップ</h2>
        <div class="actions">
          <button class="soft" id="exportJson">JSONエクスポート</button>
          <button class="soft" id="exportCsv">CSVエクスポート</button>
          <button class="danger" id="wipeAll">全データ削除</button>
        </div>
        <label for="importJson" style="margin-top:12px">JSONインポート</label>
        <textarea id="importJson" placeholder="エクスポートしたJSONを貼り付け"></textarea>
        <div class="actions">
          <button class="soft" id="appendJson">追加インポート</button>
          <button class="warn" id="replaceJson">置き換えインポート</button>
        </div>
        <h3 style="margin-top:16px">使い方</h3>
        <ul class="help-list">
          <li>スマホで範囲を開き、公式音声を聞いたら「次へ」で進みます。</li>
          <li>API取得や再取得は、確認画面で単語数を見てから実行します。</li>
        </ul>
      </section>

      <section class="panel hidden" id="wordPanel" style="grid-column:1/-1">
        <div class="range-head">
          <div>
            <h2 id="openRangeTitle">単語確認</h2>
            <div class="meta" id="openRangeMeta"></div>
          </div>
          <button class="soft" id="closeWords">閉じる</button>
        </div>
        <div class="learning-toolbar">
          <div class="test-launch-actions">
            <button class="primary" id="startEnToJa">英語 → 日本語 15問</button>
            <button class="primary" id="startJaToEn">日本語 → 英語 15問</button>
          </div>
          <div class="toolbar-field">
            <label for="wordFilter">単語の表示</label>
            <select id="wordFilter">
              <option value="all">すべて</option>
              <option value="unrated">未判定</option>
              <option value="hard">苦手</option>
              <option value="known">覚えた</option>
            </select>
          </div>
          <div class="toolbar-field">
            <label for="playbackInterval">単語間隔</label>
            <select id="playbackInterval">
              <option value="1">1秒</option>
              <option value="2">2秒</option>
              <option value="3">3秒</option>
            </select>
          </div>
          <div class="playback-actions">
            <button class="primary" id="continuousStart" aria-pressed="false">連続再生開始</button>
            <button class="soft" id="continuousStop" disabled>停止</button>
          </div>
        </div>
        <div id="wordList"></div>
      </section>

      <section class="panel hidden test-panel" id="testPanel" style="grid-column:1/-1">
        <div id="testContent"></div>
      </section>
    </main>
    <div class="jump-fab" id="jumpFab">
      <button class="soft" id="jumpTop" aria-label="ページ上部へ">↑</button>
      <button class="soft" id="jumpBottom" aria-label="ページ下部へ">↓</button>
    </div>
  </div>

  <div id="modalRoot" class="modal-backdrop hidden" role="dialog" aria-modal="true"></div>
  <div id="toast" class="toast hidden"></div>

  <script defer src="js/test.js?v=24"></script>
  <script defer src="js/app.js?v=24"></script>
</body>
</html>
